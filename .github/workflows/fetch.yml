name: fetch-flood-data
on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch.mjs
      - name: commit data
        run: |
          git config user.name "flood-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "data: $(TZ=Asia/Bangkok date '+%Y-%m-%d %H:%M')"
          git push
