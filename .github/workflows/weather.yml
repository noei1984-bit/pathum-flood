name: weather-daily
on:
  schedule:
    - cron: '5 17 * * *'   # 00:05 น. เวลาไทย
    - cron: '5 5 * * *'    # 12:05 น. เวลาไทย
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: fetch
  cancel-in-progress: false
jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/weather.mjs
      - name: commit
        run: |
          git config user.name "flood-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather.json
          git diff --cached --quiet && exit 0
          git commit -m "weather: $(TZ=Asia/Bangkok date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
